<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/demo/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#060B16">
  <meta name="apple-mobile-web-app-title" content="FORGE Talent Connections">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FORGE Talent Connections</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; background: #060B16; }
    /* Branded loading splash, shown until Flutter paints its first frame.
       Colors mirror the design tokens: navy ground, gold brand, sub text. */
    #forge-splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(#0F1A33, #060B16);
      transition: opacity 260ms ease-out;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #forge-splash img { width: 120px; height: auto; }
    #forge-splash .wordmark {
      margin-top: 10px; font-size: 40px; font-weight: 700;
      letter-spacing: 4px; color: #E3B341;
    }
    #forge-splash .descriptor {
      margin-top: 6px; font-size: 12px; font-weight: 600;
      letter-spacing: 4px; color: #93A0BC;
    }
    #forge-splash .bar {
      margin-top: 26px; width: 120px; height: 2px;
      background: #334059; overflow: hidden; border-radius: 2px;
    }
    #forge-splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: #E3B341; animation: forge-load 1.1s ease-in-out infinite;
    }
    @keyframes forge-load {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #forge-splash .bar::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="forge-splash" aria-label="FORGE Talent Connections is loading">
    <img src="assets/assets/brand/forge_flame_dark_bg.png" alt="">
    <div class="wordmark">FORGE</div>
    <div class="descriptor">TALENT CONNECTIONS</div>
    <div class="bar"></div>
  </div>
  <script>
    // Flutter dispatches this event once the first frame has rendered; the
    // splash fades and is removed rather than hidden, so it cannot intercept
    // input afterwards.
    window.addEventListener("flutter-first-frame", function () {
      var splash = document.getElementById("forge-splash");
      if (!splash) return;
      splash.style.opacity = "0";
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
