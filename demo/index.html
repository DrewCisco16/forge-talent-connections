<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/demo/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FORGE Talent Connections demo: invitation-only project collaboration with provable trust. Sample data only, no backend attached.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#060B16">
  <meta name="apple-mobile-web-app-title" content="FORGE Talent Connections">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FORGE Talent Connections</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; background: #060B16; }
    /* Branded loading splash, shown until Flutter paints its first frame.
       Colors mirror the design tokens: navy ground, gold brand, sub text. */
    #forge-splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(#0F1A33, #060B16);
      transition: opacity 260ms ease-out;
      font-family: Arial, "Helvetica Neue", -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    /* The phoenix medallion, resting: a soft gold halo and a slow breath,
       the same rhythm the app's medallion keeps. */
    .mark { position: relative; width: 112px; }
    .mark img {
      display: block; width: 112px; height: auto;
      filter: drop-shadow(0 0 14px rgba(227, 179, 65, 0.34))
              drop-shadow(0 0 30px rgba(227, 179, 65, 0.14));
      animation: forge-breath 2.4s ease-in-out infinite;
    }
    @keyframes forge-breath {
      0%, 100% { transform: scale(1);     filter: drop-shadow(0 0 14px rgba(227, 179, 65, 0.34)) drop-shadow(0 0 30px rgba(227, 179, 65, 0.14)) brightness(1); }
      50%      { transform: scale(1.022); filter: drop-shadow(0 0 18px rgba(227, 179, 65, 0.48)) drop-shadow(0 0 36px rgba(227, 179, 65, 0.20)) brightness(1.06); }
    }
    @media (prefers-reduced-motion: reduce) {
      .mark img { animation: none; }
    }
    #forge-splash .lockup { margin-top: 14px; display: block; }
    #forge-splash .bar {
      margin-top: 26px; width: 120px; height: 2px;
      background: #334059; overflow: hidden; border-radius: 2px;
    }
    #forge-splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: #E3B341; animation: forge-load 1.1s ease-in-out infinite;
    }
    @keyframes forge-load {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #forge-splash .bar::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="forge-splash" aria-label="FORGE Talent Connections is loading">
    <div class="mark">
      <img src="assets/assets/brand/forge_phoenix_medallion.png" alt="">
    </div>
    <!-- One even block, like the marketing sticker: both lines fitted to
         the same width via textLength. -->
    <svg class="lockup" width="240" height="104" viewBox="0 0 240 104"
         role="img" aria-label="FORGE TALENT CONNECTIONS">
      <defs>
        <linearGradient id="forge-gg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#F2C759"/>
          <stop offset="1" stop-color="#C79929"/>
        </linearGradient>
      </defs>
      <text x="0" y="58" textLength="240" lengthAdjust="spacingAndGlyphs"
            style="font: 800 64px Arial, sans-serif; fill: url(#forge-gg);">FORGE</text>
      <rect x="0" y="72" width="240" height="1.5" fill="url(#forge-gg)"/>
      <text x="0" y="98" textLength="240" lengthAdjust="spacingAndGlyphs"
            style="font: 700 19px Arial, sans-serif; fill: #F5F7FC;">TALENT CONNECTIONS</text>
    </svg>
    <div class="bar"></div>
  </div>
  <script>
    // Flutter dispatches this event once the first frame has rendered; the
    // splash fades and is removed rather than hidden, so it cannot intercept
    // input afterwards.
    window.addEventListener("flutter-first-frame", function () {
      var splash = document.getElementById("forge-splash");
      if (!splash) return;
      splash.style.opacity = "0";
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
