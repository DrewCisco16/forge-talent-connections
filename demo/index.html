<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/demo/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#060B16">
  <meta name="apple-mobile-web-app-title" content="FORGE Talent Connections">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>FORGE Talent Connections</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; padding: 0; background: #060B16; }
    /* Branded loading splash, shown until Flutter paints its first frame.
       Colors mirror the design tokens: navy ground, gold brand, sub text. */
    #forge-splash {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(#0F1A33, #060B16);
      transition: opacity 260ms ease-out;
      font-family: Arial, "Helvetica Neue", -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    /* The logo never moves; a small, subtle burn rides its crown (the mark's
       tip sits at ~44% of the width) - clipped to the mark's own box so the
       fire never spills past the design. */
    .mark { position: relative; width: 120px; overflow: hidden; }
    .mark img {
      display: block; position: relative; z-index: 1;
      width: 120px; height: auto;
      filter: drop-shadow(0 0 16px rgba(227, 179, 65, 0.30));
    }
    /* Asymmetric by design: a small lick left of the tip, the tallest just
       right of it, then the chain down the right edge. */
    .mark .pyre, .mark .pyre2, .mark .pyre3, .mark .pyre4 {
      content: ""; position: absolute; z-index: 0;
      left: 47%; bottom: calc(100% - 44px); width: 34px; height: 40px;
      transform-origin: 50% 100%;
      background: radial-gradient(ellipse 50% 65% at 50% 90%,
        rgba(242, 199, 89, 0.50), rgba(199, 153, 41, 0.22) 55%,
        rgba(199, 153, 41, 0) 75%);
      filter: blur(6px);
      animation: forge-wave 2.2s ease-in-out infinite;
    }
    .mark .pyre2 {
      left: 36%; bottom: calc(100% - 50px);
      width: 20px; height: 26px; filter: blur(4px);
      animation: forge-wave2 1.7s ease-in-out infinite;
    }
    /* Small flames stepping down the right edge of the silhouette. */
    .mark .pyre3 {
      left: 80%; bottom: calc(100% - 78px); width: 26px; height: 32px;
      animation-duration: 1.9s;
    }
    .mark .pyre4 {
      left: 88%; bottom: calc(100% - 100px); width: 20px; height: 26px;
      animation: forge-wave2 2.1s ease-in-out infinite;
      filter: blur(4px);
    }
    @keyframes forge-wave {
      0%   { transform: translateX(-50%) skewX(0deg)  scaleY(1);    opacity: .55; }
      30%  { transform: translateX(-54%) skewX(-4deg) scaleY(1.12); opacity: .7;  }
      60%  { transform: translateX(-46%) skewX(3deg)  scaleY(0.94); opacity: .5;  }
      100% { transform: translateX(-50%) skewX(0deg)  scaleY(1);    opacity: .55; }
    }
    @keyframes forge-wave2 {
      0%   { transform: translateX(-48%) skewX(2deg)  scaleY(0.95); opacity: .45; }
      45%  { transform: translateX(-53%) skewX(-3deg) scaleY(1.14); opacity: .65; }
      100% { transform: translateX(-48%) skewX(2deg)  scaleY(0.95); opacity: .45; }
    }
    @media (prefers-reduced-motion: reduce) {
      .mark .pyre, .mark .pyre2, .mark .pyre3, .mark .pyre4 { animation: none; }
    }
    #forge-splash .wordmark-text {
      margin-top: 14px; font-size: 44px; font-weight: 700; letter-spacing: 4px;
      background: linear-gradient(#F2C759, #C79929);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    #forge-splash .descriptor {
      margin-top: 6px; font-size: 18px; font-weight: 700;
      letter-spacing: 3.4px; color: #F5F7FC;
    }
    #forge-splash .bar {
      margin-top: 26px; width: 120px; height: 2px;
      background: #334059; overflow: hidden; border-radius: 2px;
    }
    #forge-splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%;
      background: #E3B341; animation: forge-load 1.1s ease-in-out infinite;
    }
    @keyframes forge-load {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #forge-splash .bar::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="forge-splash" aria-label="FORGE Talent Connections is loading">
    <div class="mark">
      <div class="pyre"></div>
      <div class="pyre2"></div>
      <div class="pyre3"></div>
      <div class="pyre4"></div>
      <img src="assets/assets/brand/forge_flame.png" alt="">
    </div>
    <div class="wordmark-text" role="img" aria-label="FORGE">FORGE</div>
    <div class="descriptor">TALENT CONNECTIONS</div>
    <div class="bar"></div>
  </div>
  <script>
    // Flutter dispatches this event once the first frame has rendered; the
    // splash fades and is removed rather than hidden, so it cannot intercept
    // input afterwards.
    window.addEventListener("flutter-first-frame", function () {
      var splash = document.getElementById("forge-splash");
      if (!splash) return;
      splash.style.opacity = "0";
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
