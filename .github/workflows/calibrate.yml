name: calibrate

# MANUAL ONLY, AND THAT IS THE POINT.
#
# This is the one workflow in the repository that SPENDS MONEY: it calls five
# third-party vendors with real credentials. It therefore has no push trigger,
# no pull_request trigger and no schedule. A calibration must be something a
# person decided to run, at a moment they chose, with a ceiling they set.
#
# workflow_dispatch is also what makes it runnable from a phone: the GitHub
# mobile app and the web UI both expose a "Run workflow" button for it, so the
# operator needs no laptop, no terminal, and no local copy of the credentials.
on:
  workflow_dispatch:
    inputs:
      n_items:
        description: "How many propositions (even number). More items, steadier rho, slightly more cost."
        required: true
        default: "24"
      seed:
        description: "Item-set seed. The same seed gives the same questions, so two runs are comparable."
        required: true
        default: "20260829"
      max_cost_usd:
        description: "Hard ceiling for this run in USD. The run stops rather than exceeding it."
        required: true
        default: "1.00"
      confirm:
        description: "Type SPEND to confirm this run may call the paid vendor APIs."
        required: true
        default: ""

# Never two calibrations at once: they would bill in parallel against one
# ceiling, and the ledger cannot see spend from another runner.
concurrency:
  group: calibrate
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: adjudication

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      # THE CONFIRMATION IS CHECKED BEFORE ANYTHING ELSE, deliberately before
      # checkout and before secrets are ever placed on disk. A mis-tap on a
      # phone should cost nothing at all, not "nothing except the part that
      # already ran".
      - name: Require explicit spend confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "SPEND" ]; then
            echo "::error::Not confirmed. Type SPEND in the confirm box to authorise paid vendor calls."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: adjudication/requirements-dev.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # THE SETTINGS FILE IS A SECRET TOO, and not because it holds a key --
      # it does not. profiles.json is gitignored, so it is simply not in the
      # checkout, and a run without it fails at load time. It travels as a
      # secret because that is the only channel that reaches a runner without
      # putting vendor endpoints in the repository.
      - name: Materialise settings file
        env:
          PROFILES_JSON: ${{ secrets.ADJ_PROFILES_JSON }}
        run: |
          if [ -z "$PROFILES_JSON" ]; then
            echo "::error::Secret ADJ_PROFILES_JSON is not set. See adjudication/CALIBRATING.md."
            exit 1
          fi
          printf '%s' "$PROFILES_JSON" > profiles.json
          python run_adjudication.py --check-profiles profiles.json

      # Written with printf from the environment rather than echoed, so no key
      # is ever a command argument: arguments are visible in a process listing,
      # environment variables are not. GitHub masks registered secrets in logs,
      # but this must not depend on that masking to be safe.
      - name: Materialise credentials
        env:
          K1: ${{ secrets.ADJ_SEAT_1_API_KEY }}
          K2: ${{ secrets.ADJ_SEAT_2_API_KEY }}
          K3: ${{ secrets.ADJ_SEAT_3_API_KEY }}
          K4: ${{ secrets.ADJ_SEAT_4_API_KEY }}
          K5: ${{ secrets.ADJ_SEAT_5_API_KEY }}
          M1: ${{ secrets.ADJ_SEAT_1_MODEL }}
          M2: ${{ secrets.ADJ_SEAT_2_MODEL }}
          M3: ${{ secrets.ADJ_SEAT_3_MODEL }}
          M4: ${{ secrets.ADJ_SEAT_4_MODEL }}
          M5: ${{ secrets.ADJ_SEAT_5_MODEL }}
        run: |
          umask 077
          : > .env
          missing=""
          for n in 1 2 3 4 5; do
            eval "k=\$K$n"; eval "m=\$M$n"
            [ -n "$k" ] || missing="$missing ADJ_SEAT_${n}_API_KEY"
            [ -n "$m" ] || missing="$missing ADJ_SEAT_${n}_MODEL"
            printf 'ADJ_SEAT_%s_API_KEY=%s\n' "$n" "$k" >> .env
            printf 'ADJ_SEAT_%s_MODEL=%s\n' "$n" "$m" >> .env
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          echo "5 seats configured (values not shown)."

      - name: Run calibration
        run: |
          python calibrate.py \
            --profiles profiles.json \
            --env .env \
            --n-items "${{ inputs.n_items }}" \
            --seed "${{ inputs.seed }}" \
            --max-cost "${{ inputs.max_cost_usd }}" \
            --json calibration.json \
            --transcript calibration-transcript.json \
            | tee calibration.txt

      # ALWAYS, INCLUDING ON FAILURE. A run that spent money and then failed is
      # exactly the run whose partial output is worth reading; discarding it
      # means paying again to learn the same thing.
      #
      # calibration-transcript.json carries the seats' raw replies, so a score
      # that looks wrong -- a seat that reworded the statements, a seat cut off
      # mid-reply -- can be re-examined and re-scored on a laptop for nothing:
      #     python calibrate.py --rescore calibration-transcript.json
      # It holds generated arithmetic and the models' answers to it. No claim
      # text, no artifact, no credential.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calibration-report
          path: |
            adjudication/calibration.txt
            adjudication/calibration.json
            adjudication/calibration-transcript.json
          if-no-files-found: warn
          retention-days: 30

      # Credentials are removed even though the runner is destroyed anyway.
      # The upload step above runs on failure, and a future edit that widened
      # its path list would otherwise publish .env as a build artifact.
      - name: Shred credentials
        if: always()
        run: rm -f .env profiles.json
