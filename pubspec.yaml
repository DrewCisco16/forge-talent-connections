name: forge_talent_connections
description: FORGE Talent Connections consumer mobile app (walled UI layer).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # State management: Riverpod. Chosen per build prompt s2; never mixed with Provider.
  flutter_riverpod: ^2.6.1
  # Routing: go_router, locked by build prompt s2.
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/heroes/
    - assets/brand/
