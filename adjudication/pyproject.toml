[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE001 stays ENABLED. The blind excepts in this package are the fail-closed
# handlers required by SOP Manual v1.1 -- every one carries a local noqa naming
# the reason, so a new unjustified one is still reported.
select = ["E", "F", "W", "I", "UP", "B", "BLE", "RUF", "FURB", "PLR", "SIM", "C4"]
ignore = [
    "E501",     # line length is handled by the formatter
    "PLR2004",  # magic values in tests are the expected values under test
    "PLR0912",  # branch count: the gate router is deliberately explicit
    "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
"test_suite.py" = ["PLR0913", "B011"]
# Property tests intentionally reach into module internals and use
# broad strategies; the assertions are the contract, not the style.
"test_properties.py" = ["PLR0913", "B011", "PLR2004", "PLC0415"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
# strict was turned on after the modules were written, not before, and it
# found four things worth having: an untyped operator table whose arity was
# enforced by CPython's grammar rather than by the table, an untyped tuple
# that made the residual -- the convergence number the stop rule reads -- an
# Any, a body template that could fill to a non-object and be posted anyway,
# and an unannotated aggregator in the leave-one-seat-out diagnostic.
strict = true
files = ["seat_independence.py", "adjudication_orchestrator.py", "validation_harness.py", "audit_log.py", "seat_adapter.py", "correctness_matrix.py", "run_adjudication.py", "seat_profiles.py"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["test_suite.py", "test_properties.py"]

# --- deliberate exemptions, each with its reason -------------------------
[tool.ruff.lint.extend-per-file-ignores]
"adjudication_orchestrator.py" = [
    "UP042",    # (str, Enum) is the existing contract; StrEnum changes str() output
                # and the audit records serialise these values
    "PLR0911",  # classify_source is a classifier: one explicit return per class
                # beats a clever lookup that hides the fail-closed default
]
"seat_adapter.py" = [
    "PLR0913",  # HttpSeat's constructor is keyword-only configuration; collapsing
                # it into a config object would hide which knobs exist
]
"seat_profiles.py" = [
    "PLR0911",  # _substitute returns one branch per placeholder type. The
                # explicit branches are what make the native-typing rule
                # readable; a lookup table would hide that "{{max_tokens}}"
                # alone returns an int while an embedded one returns a string.
]
"run_adjudication.py" = [
    "PLR0911",  # main() is a CLI: one early return per operator error, each
                # with the message that names the fix. Collapsing them costs
                # the specific diagnosis, which is the whole value.
    "PLR0913", "PLR0917",  # run_adjudication and collect_holes take the run's
                # inputs one per parameter. Bundling them into a config object
                # would hide which of them are optional and which are the
                # fail-closed ones, and this is the operator-facing entry point
                # where that has to be legible at the call site.
]
"seat_independence.py" = [
    "PLR0913", "PLR0917",  # diagnose() takes six optional data sources by design
    "SIM108",   # the chao1 f2>0 branch is clearer as if/else than as a ternary
    "FURB110",  # the explicit ternary documents the intentional falsy-zero path
]

[tool.bandit]
# Scans the engine modules. The test suite is excluded: it deliberately
# constructs hostile payloads, and flagging those is noise, not signal.
exclude_dirs = [".venv"]
